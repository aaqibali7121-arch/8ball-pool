name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o 8ball_live_android_apk_build_ready.zip -d project
          echo "Files:"
          find project -maxdepth 5 -type f | head -100

      - name: Find project directory
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i \
            -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e "s/jvmTarget = ['\"]1\.8['\"]/jvmTarget = '17'/g" \
            {} \;

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
