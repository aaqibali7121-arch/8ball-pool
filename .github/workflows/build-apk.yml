name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o 8ball_live_android_apk_build_ready.zip -d project
          echo "Files:"
          find project -maxdepth 6 -type f | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle wrapper
        run: |
          echo "Searching for gradlew..."
          find "$GITHUB_WORKSPACE/project" -type f -name "gradlew" -print

      - name: Build APK
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/project" -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            echo "Project files:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"

          ./gradlew assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$GITHUB_WORKSPACE/project" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ github.workspace }}/project/**/*.apk
          if-no-files-found: error
